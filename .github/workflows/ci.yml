name: CI

# Assignment requirement 3.10: at least one Continuous Integration workflow that
# runs automatically on every push and reports a clear Passed/Failed result for
#   Dependencies -> Build Project -> Test / Lint
# Each step is named so the Actions tab shows exactly which stage failed.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel an in-flight run when the same branch is pushed again, so the latest
# commit is always the one being verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Declared here so the integration step can test for them. A fork has neither
  # secret, and the step is skipped rather than failing.
  TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}

jobs:
  verify:
    name: Install, Lint, Typecheck and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # The test suite runs TypeScript directly through the Node.js built-in
          # type stripping, which needs Node >= 22.6. Next.js 16 needs >= 20.9.
          node-version: 22.20.0
          cache: npm

      - name: 1. Install dependencies
        id: deps
        run: npm ci

      - name: 2. Lint
        id: lint
        run: npm run lint

      - name: 3. Test
        id: test
        run: npm test

      # The integration suite needs a Supabase project to talk to. It only ever
      # uses the publishable anon key, signs up throwaway accounts and deletes
      # what it created, so it is safe against the live project. The step is
      # skipped rather than failed when the two repository secrets are absent,
      # which keeps a fork from failing for a reason that has nothing to do with
      # the code.
      #
      # To enable it, add these under Settings -> Secrets -> Actions:
      #   TEST_SUPABASE_URL       https://<project-ref>.supabase.co
      #   TEST_SUPABASE_ANON_KEY  the publishable key
      - name: 4. Integration test (needs Supabase secrets)
        id: testdb
        if: ${{ env.TEST_SUPABASE_URL != '' }}
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
        run: npm run test:db

      # `next typegen` writes the route/layout types that Next.js provides
      # through `LayoutProps`, `PageProps` and friends. Those live in .next/types,
      # which is gitignored, so a fresh CI checkout does not have them and
      # `tsc` would fail with "Cannot find name 'LayoutProps'". Generating them
      # first makes the typecheck run against the same types a developer gets.
      - name: 5. Generate Next.js route types
        id: typegen
        run: npx next typegen

      - name: 6. Typecheck
        id: types
        run: npm run typecheck

      - name: 7. Build
        id: build
        run: npm run build

      - name: Summary
        if: always()
        run: |
          {
            echo "### CI result"
            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Install dependencies | ${{ steps.deps.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Test | ${{ steps.test.outcome }} |"
            echo "| Integration test | ${{ steps.testdb.outcome }} |"
            echo "| Generate route types | ${{ steps.typegen.outcome }} |"
            echo "| Typecheck | ${{ steps.types.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
